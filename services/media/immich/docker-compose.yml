services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0
    container_name: immich
    restart: unless-stopped
    devices:
    - /dev/dri:/dev/dri
    group_add:
    - '44'
    environment:
    - TZ=${TZ}
    - DB_HOSTNAME=immich-postgres
    - DB_USERNAME=${IMMICH_DB_USER}
    - DB_PASSWORD=${IMMICH_DB_PASSWORD}
    - DB_DATABASE_NAME=${IMMICH_DB_NAME}
    - REDIS_HOSTNAME=immich-redis
    - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    volumes:
    - ${APPDATA_PATH}/immich/photos:/usr/src/app/upload
    - ${APPDATA_PATH}/immich/libraries:/libraries
    - /etc/localtime:/etc/localtime:ro
    labels:
    - traefik.enable=true
    - traefik.docker.network=internal_net
    - traefik.http.routers.immich.rule=Host(`immich.${DOMAIN}`)
    - traefik.http.routers.immich.entrypoints=web
    - traefik.http.routers.immich.middlewares=crowdsec@file
    - traefik.http.services.immich.loadbalancer.server.port=2283
    - kuma.immich.type=http
    - kuma.immich.url=http://immich:2283/api/server/ping
    - kuma.immich.name=Immich Photos
    - kuma.immich.interval=60
    - kuma.immich.keyword=pong
    - kuma.immich.tags=media,photos
    - net.unraid.docker.icon=https://raw.githubusercontent.com/selfhosted/unRAID-CA-templates/master/templates/img/immich-icon.png
    - net.unraid.docker.webui=http://immich.${DOMAIN}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.3'
          memory: 600M
    networks:
    - internal_net
    - db_net
    depends_on:
    - immich-postgres
    - immich-redis
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
    container_name: immich-ml
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${APPDATA_PATH}/immich/model-cache:/cache
    labels:
    - net.unraid.docker.icon=https://raw.githubusercontent.com/selfhosted/unRAID-CA-templates/master/templates/img/immich-icon.png
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
    - internal_net
  immich-postgres:
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3
    container_name: Immich_PostgreSQL
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - HOST_OS=Unraid
    - HOST_HOSTNAME=JP-Dell
    - HOST_CONTAINERNAME=Immich_PostgreSQL
    - POSTGRES_DB=${IMMICH_DB_NAME}
    - POSTGRES_USER=${IMMICH_DB_USER}
    - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
    volumes:
    - ${CACHE_PATH}/ImmichPostgres:/var/lib/postgresql
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    labels:
    - net.unraid.docker.icon=https://raw.githubusercontent.com/selfhosted/unRAID-CA-templates/master/templates/img/postgresql-icon.png
    networks:
    - db_net
  immich-redis:
    image: redis:8.10.1-alpine
    container_name: immich-redis
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - HOST_OS=Unraid
    - HOST_HOSTNAME=JP-Dell
    - HOST_CONTAINERNAME=immich-redis
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    labels:
    - net.unraid.docker.icon=https://raw.githubusercontent.com/selfhosted/unRAID-CA-templates/master/templates/img/redis-icon.png
    volumes:
    - ${CACHE_PATH}/immich/redis:/data
    networks:
    - db_net
networks:
  internal_net:
    external: true
  db_net:
    external: true
