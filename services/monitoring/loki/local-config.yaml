# Loki single-node config. Deployed copy lives at ${OBSERVABILITY_PATH}/loki/config/local-config.yaml.
auth_enabled: false

server:
  http_listen_port: 3100
  http_listen_address: 0.0.0.0

ingester:
  wal:
    dir: /loki/wal
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 5m
  chunk_retain_period: 30s

schema_config:
  configs:
  # Legacy period: keeps logs written before the switch readable until they age out.
  # Remove it (and storage_config.boltdb, table_manager) once 2026-11-14 has passed.
  - from: 2018-04-15
    store: boltdb
    object_store: filesystem
    schema: v11
    index:
      prefix: index_
      period: 168h
  # Current period. The date must be in the future when this config is first deployed.
  - from: 2026-10-17
    store: tsdb
    object_store: filesystem
    schema: v13
    index:
      prefix: index_tsdb_
      period: 24h

storage_config:
  boltdb:
    directory: /loki/index
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

# Retention for the tsdb period.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  # Can be turned on once the v13 period is active (after 2026-10-17).
  allow_structured_metadata: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  retention_period: 672h  # 28 days

# Retention for the legacy boltdb period.
table_manager:
  retention_deletes_enabled: true
  retention_period: 672h
