services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ntfy
    restart: unless-stopped
    command:
    - serve
    environment:
    - TZ=${TZ}
    - HOST_OS=Unraid
    - HOST_HOSTNAME=JP-Dell
    - HOST_CONTAINERNAME=ntfy
    - NTFY_BASE_URL=https://ntfy.${DOMAIN}
    - NTFY_BEHIND_PROXY=true
    - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
    - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
    # Topics are private: create users/tokens with `ntfy user add` / `ntfy token add`.
    - NTFY_AUTH_DEFAULT_ACCESS=deny-all
    - NTFY_ENABLE_LOGIN=true
    - NTFY_ATTACHMENT_CACHE_DIR=/var/lib/ntfy/attachments
    volumes:
    - ${OBSERVABILITY_PATH}/ntfy:/var/lib/ntfy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '"healthy"\s*:\s*true' || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
    - traefik.enable=true
    - traefik.docker.network=monitoring_net
    - traefik.http.routers.ntfy.rule=Host(`ntfy.${DOMAIN}`)
    - traefik.http.routers.ntfy.entrypoints=web
    - traefik.http.routers.ntfy.middlewares=crowdsec@file
    - traefik.http.services.ntfy.loadbalancer.server.port=80
    - kuma.ntfy.http.name=ntfy
    - kuma.ntfy.http.url=http://ntfy:80/v1/health
    - 'kuma.ntfy.http.accepted_statuscodes=["200"]'
    - kuma.ntfy.http.interval=60
    - 'kuma.ntfy.http.tag_names=[{"name":"tag_monitoring"}]'
    - net.unraid.docker.icon=https://raw.githubusercontent.com/binwiederhier/ntfy/main/web/public/static/images/ntfy.png
    - net.unraid.docker.webui=http://ntfy.${DOMAIN}
    networks:
    - monitoring_net
networks:
  monitoring_net:
    external: true
