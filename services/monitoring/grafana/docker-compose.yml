services:
  grafana:
    image: grafana/grafana:13.2.4
    container_name: Grafana
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - HOST_OS=Unraid
    - HOST_HOSTNAME=JP-Dell
    - HOST_CONTAINERNAME=Grafana
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    # Installed before provisioning runs, so provisioned datasources always find their plugin.
    - GF_PLUGINS_PREINSTALL_SYNC=redis-datasource
    # Used by provisioning/datasources/datasources.yml.
    - REDIS_AUTHENTIK_PASSWORD=${REDIS_AUTHENTIK_PASSWORD}
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
    - GF_SECURITY_COOKIE_SECURE=true
    # Sign-in through Authentik (OAuth2 provider + application "grafana").
    - GF_AUTH_GENERIC_OAUTH_ENABLED=true
    - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
    - GF_AUTH_GENERIC_OAUTH_ICON=signin
    - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GRAFANA_OAUTH_CLIENT_ID}
    - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OAUTH_CLIENT_SECRET}
    - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile
    - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.${DOMAIN}/application/o/authorize/
    - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.${DOMAIN}/application/o/token/
    - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.${DOMAIN}/application/o/userinfo/
    - GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL=https://auth.${DOMAIN}/application/o/grafana/end-session/
    - GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN=true
    - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
    - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
    - "GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups, 'Grafana Admins') && 'GrafanaAdmin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'"
    volumes:
    - ${OBSERVABILITY_PATH}/grafana:/var/lib/grafana
    # Copy provisioning/ from this folder to ${OBSERVABILITY_PATH}/grafana-provisioning/.
    - ${OBSERVABILITY_PATH}/grafana-provisioning:/etc/grafana/provisioning:ro
    labels:
    - traefik.enable=true
    - traefik.docker.network=monitoring_net
    - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
    - traefik.http.routers.grafana.entrypoints=web
    - traefik.http.routers.grafana.middlewares=crowdsec@file
    - traefik.http.services.grafana.loadbalancer.server.port=3000
    - kuma.grafana.http.name=Grafana
    - kuma.grafana.http.url=http://Grafana:3000/api/health
    - 'kuma.grafana.http.accepted_statuscodes=["200"]'
    - kuma.grafana.http.interval=60
    - 'kuma.grafana.http.tag_names=[{"name":"tag_monitoring"},{"name":"tag_visualization"}]'
    - net.unraid.docker.icon=https://raw.githubusercontent.com/selfhosted/unRAID-CA-templates/master/templates/img/grafana-icon.png
    - net.unraid.docker.webui=http://grafana.${DOMAIN}
    networks:
    - monitoring_net
    - db_net
    user: ${PUID}:${PGID}
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
networks:
  monitoring_net:
    external: true
  db_net:
    external: true
