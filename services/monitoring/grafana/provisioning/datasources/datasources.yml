# Provisioned datasources. UIDs match the ones created by hand before this file existed,
# so dashboards that reference them keep working. Datasources not listed here are left alone.
apiVersion: 1

datasources:
- name: prometheus
  uid: depahngtp0pvkc
  type: prometheus
  access: proxy
  url: http://prometheus:9090
  isDefault: true
  jsonData:
    httpMethod: POST
    prometheusType: Prometheus

- name: Loki
  uid: P8E80F9AEF21F6940
  type: loki
  access: proxy
  url: http://GrafanaLoki:3100
  jsonData:
    maxLines: 1000

- name: Alertmanager
  uid: alertmanager
  type: alertmanager
  access: proxy
  url: http://alertmanager:9093
  jsonData:
    implementation: prometheus
    handleGrafanaManagedAlerts: false

# Redis plugin datasources (plugin installed via GF_PLUGINS_PREINSTALL_SYNC). Grafana reaches both over db_net.
- name: redis-datasource
  uid: eeo71m7p8oikgb
  type: redis-datasource
  access: proxy
  url: redis://Redis:6379
  jsonData:
    client: standalone

- name: redis-authentik
  uid: beo71pstt7w8we
  type: redis-datasource
  access: proxy
  url: redis://redis-authentik:6379
  jsonData:
    client: standalone
  secureJsonData:
    password: ${REDIS_AUTHENTIK_PASSWORD}
