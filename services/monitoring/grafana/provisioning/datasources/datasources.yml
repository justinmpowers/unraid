# Provisioned datasources. UIDs match the ones created by hand before this file existed,
# so dashboards that reference them keep working. Datasources not listed here are left alone.
apiVersion: 1

datasources:
- name: prometheus
  uid: depahngtp0pvkc
  type: prometheus
  access: proxy
  url: http://prometheus:9090
  isDefault: true
  jsonData:
    httpMethod: POST
    prometheusType: Prometheus

- name: Loki
  uid: P8E80F9AEF21F6940
  type: loki
  access: proxy
  url: http://GrafanaLoki:3100
  jsonData:
    maxLines: 1000

- name: Alertmanager
  uid: alertmanager
  type: alertmanager
  access: proxy
  url: http://alertmanager:9093
  jsonData:
    implementation: prometheus
    handleGrafanaManagedAlerts: false
