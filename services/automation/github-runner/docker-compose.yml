services:
  github-runner:
    image: myoung34/github-runner:2.337.0
    container_name: Docker-Compose-Runner
    restart: unless-stopped  # Service will restart the container after each job
    environment:
      # Repository configuration
      - REPO_URL=https://github.com/justinmpowers/unraid
      
      # Use PAT for automatic token generation
      - ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}
      
      # Runner configuration
      - RUNNER_NAME=unraid-docker-compose-runner
      - RUNNER_LABELS=unraid,docker-compose,automation
      # Keep the runner's work tree OFF the bind mount below. The runner puts
      # its action cache in $RUNNER_WORKDIR/_actions, so pointing this at
      # /workspace made that cache survive every "ephemeral" run on a shfs
      # share, where re-extracting an action fails with "Directory not empty".
      # Container-local means it genuinely dies with the container. /_work is
      # the image's own default root, already created and chowned to `runner`.
      - RUNNER_WORKDIR=/_work
      - RUNNER_SCOPE=repo
      
      # EPHEMERAL: Fresh environment for each job (like GitHub hosted runners)
      - EPHEMERAL=1
      
      # System configuration
      - TZ=America/New_York
      - HOST_OS=Unraid
      - HOST_HOSTNAME=JP-Dell
      - HOST_CONTAINERNAME=Docker-Compose-Runner
      
      # Docker socket proxy configuration
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      # Live docker-compose tree used by deployments. This is deliberately NOT
      # the runner's work dir: workflows treat /workspace and $GITHUB_WORKSPACE
      # as separate places and copy between them.
      - /mnt/user/appdata/renovate/unraid:/workspace:rw

      # Runner work dir is intentionally unmounted, so checkouts and the
      # _actions cache are recreated from scratch for each ephemeral job.
      # NO direct docker socket - uses docker-socket-proxy for security
    networks:
      - monitoring_net
      - docker_proxy_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    labels:
      - kuma.github_runner.docker.name=GitHub Actions Runner
      - kuma.github_runner.docker.docker_container=Docker-Compose-Runner
      - kuma.github_runner.docker.docker_host_name=local_docker
      - kuma.github_runner.docker.interval=60
      - 'kuma.github_runner.docker.tag_names=[{"name":"tag_automation"},{"name":"tag_ci-cd"}]'
      # Keep existing Unraid labels
      - net.unraid.docker.icon=https://raw.githubusercontent.com/selfhosted/unRAID-CA-templates/master/templates/img/github-runner-icon.png

networks:
  monitoring_net:
    external: true
  docker_proxy_net:
    external: true