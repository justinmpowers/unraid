services:
  jenkins:
    image: jenkins/jenkins:2.582
    container_name: jenkins
    restart: always
    ports:
    - 50000:50000
    volumes:
    - ${APPDATA_PATH}/jenkins_home:/var/jenkins_home
    environment:
    - JENKINS_OPTS=--httpPort=8080
    - DOCKER_HOST=tcp://docker-socket-proxy:2375
    - JAVA_OPTS=-Xmx2g -Xms512m
    - JENKINS_UC=https://updates.jenkins.io
    - JENKINS_UC_INSECURE=false
    labels:
    - traefik.enable=true
    - traefik.docker.network=internal_net
    - traefik.http.routers.jenkins.rule=Host(`jenkins.${DOMAIN}`)
    - traefik.http.routers.jenkins.entrypoints=web
    - traefik.http.routers.jenkins.middlewares=crowdsec@file,authentik@file
    - traefik.http.services.jenkins.loadbalancer.server.port=8080
    - kuma.jenkins.http.name=Jenkins
    - kuma.jenkins.http.url=http://jenkins:8080/login
    - kuma.jenkins.http.interval=60
    - 'kuma.jenkins.http.tag_names=[{"name":"tag_automation"},{"name":"tag_ci-cd"}]'
    networks:
    - docker_proxy_net
    - internal_net
networks:
  docker_proxy_net:
    external: true
  internal_net:
    external: true
