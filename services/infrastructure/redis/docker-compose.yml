services:
  redis:
    image: redis:8.10.1-alpine
    container_name: Redis
    restart: unless-stopped
    environment:
    - TZ=America/New_York
    - HOST_OS=Unraid
    - HOST_HOSTNAME=JP-Dell
    - HOST_CONTAINERNAME=Redis
    volumes:
    - ${CACHE_PATH}/redis:/data
    networks:
    - db_net
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    command: redis-server --appendonly yes --auto-aof-rewrite-percentage 100 --auto-aof-rewrite-min-size
      64mb
    labels:
    - kuma.redis.docker.name=Redis Cache
    - kuma.redis.docker.docker_container=Redis
    - kuma.redis.docker.docker_host_name=local_docker
    - kuma.redis.docker.interval=60
    - 'kuma.redis.docker.tag_names=[{"name":"tag_infrastructure"},{"name":"tag_cache"}]'
    - net.unraid.docker.icon=https://raw.githubusercontent.com/selfhosted/unRAID-CA-templates/master/templates/img/redis-icon.png
networks:
  db_net:
    external: true
