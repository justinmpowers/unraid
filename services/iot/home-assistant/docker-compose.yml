services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2026.8.2
    container_name: Home-Assistant-Container
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - HOST_OS=Unraid
    - HOST_HOSTNAME=JP-Dell
    - HOST_CONTAINERNAME=Home-Assistant-Container
    volumes:
    - ${HOME_ASSISTANT_PATH}/Home-Assistant-Container:/config
    - /etc/localtime:/etc/localtime:ro
    ports:
    - 8123:8123
    labels:
    - traefik.enable=true
    - traefik.docker.network=iot_net
    - traefik.http.routers.homeassistant.rule=Host(`homeassistant.${DOMAIN}`)
    - traefik.http.routers.homeassistant.entrypoints=web
    - traefik.http.services.homeassistant.loadbalancer.server.port=8123
    - kuma.homeassistant.type=http
    - kuma.homeassistant.url=http://Home-Assistant-Container:8123
    - kuma.homeassistant.name=Home Assistant
    - kuma.homeassistant.interval=60
    - kuma.homeassistant.keyword=Home Assistant
    - kuma.homeassistant.tags=iot,smart-home
    - net.unraid.docker.icon=https://raw.githubusercontent.com/selfhosted/unRAID-CA-templates/master/templates/img/home-assistant-icon.png
    - net.unraid.docker.webui=http://homeassistant.${DOMAIN}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          cpus: '0.2'
          memory: 400M
    networks:
    - iot_net
    privileged: true
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:8.1
    container_name: matter-server
    restart: unless-stopped
    command:
    - --storage-path
    - /data
    - --primary-interface
    - eth1
    environment:
    - TZ=${TZ}
    - HOST_OS=Unraid
    - HOST_HOSTNAME=JP-Dell
    - HOST_CONTAINERNAME=matter-server
    volumes:
    - ${HOME_ASSISTANT_PATH}/python-matter-server:/data
    networks:
      matter_macvlan:
        ipv4_address: 192.168.3.240
      iot_net:
        gw_priority: 100
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    labels:
    - kuma.matter_server.type=http
    - kuma.matter_server.url=http://matter-server:5540
    - kuma.matter_server.name=Matter Server
    - kuma.matter_server.interval=60
    - kuma.matter_server.tags=iot,matter
    - net.unraid.docker.icon=https://raw.githubusercontent.com/selfhosted/unRAID-CA-templates/master/templates/img/matter-server-icon.png
  wyoming-whisper:
    image: rhasspy/wyoming-whisper:3.6.0
    container_name: wyoming-whisper
    restart: unless-stopped
    command:
    - --model
    - ${WHISPER_MODEL:-tiny-int8}
    - --language
    - ${WHISPER_LANGUAGE:-en}
    - --data-dir
    - /data
    - --download-dir
    - /data
    environment:
    - TZ=${TZ}
    - HOST_OS=Unraid
    - HOST_HOSTNAME=JP-Dell
    - HOST_CONTAINERNAME=wyoming-whisper
    volumes:
    - ${HOME_ASSISTANT_PATH}/wyoming-whisper:/data
    - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
    labels:
    - kuma.wyoming_whisper.type=tcp
    - kuma.wyoming_whisper.hostname=wyoming-whisper
    - kuma.wyoming_whisper.port=10300
    - kuma.wyoming_whisper.name=Wyoming Whisper (STT)
    - kuma.wyoming_whisper.interval=60
    - kuma.wyoming_whisper.tags=iot,smart-home,voice
    networks:
    - iot_net
  wyoming-piper:
    image: rhasspy/wyoming-piper:2.4.2
    container_name: wyoming-piper
    restart: unless-stopped
    command:
    - --voice
    - ${PIPER_VOICE:-en_US-lessac-medium}
    - --data-dir
    - /data
    - --download-dir
    - /data
    environment:
    - TZ=${TZ}
    - HOST_OS=Unraid
    - HOST_HOSTNAME=JP-Dell
    - HOST_CONTAINERNAME=wyoming-piper
    volumes:
    - ${HOME_ASSISTANT_PATH}/wyoming-piper:/data
    - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    labels:
    - kuma.wyoming_piper.type=tcp
    - kuma.wyoming_piper.hostname=wyoming-piper
    - kuma.wyoming_piper.port=10200
    - kuma.wyoming_piper.name=Wyoming Piper (TTS)
    - kuma.wyoming_piper.interval=60
    - kuma.wyoming_piper.tags=iot,smart-home,voice
    networks:
    - iot_net
networks:
  iot_net:
    external: true
  matter_macvlan:
    external: true
    name: matter_vlan2
