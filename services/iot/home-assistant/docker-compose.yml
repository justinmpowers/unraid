services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2026.7.4
    container_name: Home-Assistant-Container
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - HOST_OS=Unraid
    - HOST_HOSTNAME=JP-Dell
    - HOST_CONTAINERNAME=Home-Assistant-Container
    volumes:
    - ${HOME_ASSISTANT_PATH}/Home-Assistant-Container:/config
    - /etc/localtime:/etc/localtime:ro
    labels:
    # host networking (needed for mDNS/ESPHome discovery) takes this
    # container off iot_net, so Traefik's docker label provider can no
    # longer discover it automatically. Routing for homeassistant.${DOMAIN}
    # is defined as a static router/service in Traefik's file provider
    # (dynamic.yml on the host) instead - see services/iot/home-assistant/README.md.
    - kuma.homeassistant.type=http
    - kuma.homeassistant.url=http://${UNRAID_HOST_IP}:8123
    - kuma.homeassistant.name=Home Assistant
    - kuma.homeassistant.interval=60
    - kuma.homeassistant.keyword=Home Assistant
    - kuma.homeassistant.tags=iot,smart-home
    - net.unraid.docker.icon=https://raw.githubusercontent.com/selfhosted/unRAID-CA-templates/master/templates/img/home-assistant-icon.png
    - net.unraid.docker.webui=http://homeassistant.${DOMAIN}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          cpus: '0.2'
          memory: 400M
    network_mode: host
    privileged: true
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:8.1
    container_name: matter-server
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - HOST_OS=Unraid
    - HOST_HOSTNAME=JP-Dell
    - HOST_CONTAINERNAME=matter-server
    volumes:
    - ${HOME_ASSISTANT_PATH}/python-matter-server:/data
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    labels:
    - kuma.matter_server.type=http
    - kuma.matter_server.url=http://matter-server:5540
    - kuma.matter_server.name=Matter Server
    - kuma.matter_server.interval=60
    - kuma.matter_server.tags=iot,matter
    - net.unraid.docker.icon=https://raw.githubusercontent.com/selfhosted/unRAID-CA-templates/master/templates/img/matter-server-icon.png
  esphome:
    image: esphome/esphome:2026.7.4
    container_name: esphome
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - HOST_OS=Unraid
    - HOST_HOSTNAME=JP-Dell
    - HOST_CONTAINERNAME=esphome
    - USERNAME=${ESPHOME_USERNAME:-}
    - PASSWORD=${ESPHOME_PASSWORD:-}
    volumes:
    - ${HOME_ASSISTANT_PATH}/esphome:/config
    - /etc/localtime:/etc/localtime:ro
    # host networking needed to discover/adopt devices over mDNS and to
    # push OTA firmware/config updates - same reasoning as home-assistant.
    # Not routed through Traefik; access directly at http://${UNRAID_HOST_IP}:6052
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    labels:
    - kuma.esphome.type=http
    - kuma.esphome.url=http://${UNRAID_HOST_IP}:6052
    - kuma.esphome.name=ESPHome Dashboard
    - kuma.esphome.interval=60
    - kuma.esphome.tags=iot,smart-home
    - net.unraid.docker.webui=http://${UNRAID_HOST_IP}:6052
